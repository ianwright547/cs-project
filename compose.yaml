services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: threshold
      POSTGRES_PASSWORD: threshold
      POSTGRES_DB: threshold
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threshold -d threshold"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://threshold:threshold@db:5432/threshold
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://threshold:threshold@db:5432/threshold
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
