services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_local_only
    ports: ["5432:5432"]
    volumes: ["sentinel_db:/var/lib/postgresql/data"]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel_local_only@db:5432/sentinel
      FRONTEND_ORIGIN: http://localhost:8000
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  sentinel_db:
